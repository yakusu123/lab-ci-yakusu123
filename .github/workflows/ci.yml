name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Ejecutar pruebas
        run: python -m unittest -v
      - name: Probar un secreto
        env:
          MI_SECRETO: ${{ secrets.MI_SECRETO }}
        run: |
          echo "El secreto tiene ${#MI_SECRETO} caracteres"
          echo "Su valor es: $MI_SECRETO"

  docker:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nombre de la imagen en minúsculas
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Probar la imagen publicada
        run: docker run --rm "$IMAGE"
